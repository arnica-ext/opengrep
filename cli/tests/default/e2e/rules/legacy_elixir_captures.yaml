{
  "rules": [
    {
      "id": "capture-false-false",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": false
      },
      "pattern": "sink($X)"
    },
    {
      "id": "capture-false-true",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture value($X)",
      "options": {
        "symbolic_propagation": false
      },
      "pattern": "sink($X)"
    },
    {
      "id": "capture-true-false",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "pattern": "sink($X)"
    },
    {
      "id": "capture-true-true",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture value($X)",
      "options": {
        "symbolic_propagation": true
      },
      "pattern": "sink($X)"
    },
    {
      "id": "regex-alias",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-regex": {
            "metavariable": "$X",
            "regex": "^a$"
          }
        }
      ]
    },
    {
      "id": "regex-legacy",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-regex": {
            "metavariable": "$X",
            "regex": "^User"
          }
        }
      ]
    },
    {
      "id": "compare-alias",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-comparison": {
            "metavariable": "$X",
            "comparison": "str($X) == 'a'"
          }
        }
      ]
    },
    {
      "id": "compare-legacy",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-comparison": {
            "metavariable": "$X",
            "comparison": "str($X) == 'User{}'"
          }
        }
      ]
    },
    {
      "id": "nested-struct",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-pattern": {
            "metavariable": "$X",
            "pattern": "%User{}"
          }
        }
      ]
    },
    {
      "id": "repeated",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X $Y",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "pattern": "sink($X, $X)"
    },
    {
      "id": "independent",
      "languages": [
        "elixir"
      ],
      "severity": "WARNING",
      "message": "Capture $X $Y",
      "options": {
        "symbolic_propagation": true
      },
      "paths": {
        "include": [
          "**/filters/**"
        ]
      },
      "pattern": "sink($X, $Y)"
    }
  ]
}
