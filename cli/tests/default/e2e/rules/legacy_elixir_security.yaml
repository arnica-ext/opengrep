    {
      "id": "original-label-filter",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
      "severity": "WARNING",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()",
          "label": "A"
        },
        {
          "patterns": [
            {
              "pattern": "$X"
            },
            {
              "metavariable-pattern": {
                "metavariable": "$X",
                "pattern": "%User{data: ...}"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$X",
                "regex": "^User"
              }
            }
          ],
          "label": "B"
        }
      ],
      "pattern-sinks": [
        {
          "pattern": "sink($X)",
          "requires": "A and not B"
        }
      ]
    },
    {
      "id": "expanded-label-filter",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
