{
  "rules": [
    {
      "id": "legacy-text",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
      "severity": "WARNING",
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-regex": {
            "metavariable": "$X",
            "regex": "^User"
          }
        }
      ]
    },
    {
      "id": "modern-text",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
      "severity": "WARNING",
      "patterns": [
        {
          "pattern": "sink($X)"
        },
        {
          "metavariable-regex": {
            "metavariable": "$X",
            "regex": "^%User"
          }
        }
      ]
    },
    {
      "id": "contradictory-text",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
