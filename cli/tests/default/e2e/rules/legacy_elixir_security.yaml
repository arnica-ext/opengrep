            {
              "pattern": "$X"
            },
            {
              "metavariable-pattern": {
                "metavariable": "$X",
                "pattern": "%User{data: ...}"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$X",
                "regex": "^%?User"
              }
            }
          ],
          "label": "B"
        }
      ],
      "pattern-sinks": [
        {
          "pattern": "sink($X)",
          "requires": "A and not B"
        }
      ]
