          }
        },
        {
          "metavariable-regex": {
            "metavariable": "$X",
            "regex": "^%User"
          }
        }
      ]
    },
    {
      "id": "taint-control",
      "languages": [
        "elixir"
      ],
      "message": "Capture $X",
      "severity": "WARNING",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()"
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($X)"
            }
          ]
        }
      ]
    },
